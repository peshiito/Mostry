<script data-purpose="otp-handling">
    document.addEventListener('DOMContentLoaded', () => {
      // OTP focus movement logic
      const inputs = document.querySelectorAll('.otp-box');
      
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          if (e.target.value.length > 1) {
            e.target.value = e.target.value.slice(-1);
          }
          if (e.target.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        // Paste support for 6-digit codes
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pastedData = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
          if (pastedData) {
            const digits = pastedData.split('').slice(0, inputs.length);
            digits.forEach((digit, i) => {
              inputs[i].value = digit;
            });
            const nextFocusIndex = Math.min(digits.length, inputs.length - 1);
            inputs[nextFocusIndex].focus();
          }
        });
      });

      // Copy secret key logic
      const copyBtn = document.getElementById('copy-btn');
      const copyLabel = document.getElementById('copy-label');
      const secretKey = document.getElementById('secret-key');

      if (copyBtn && secretKey) {
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(secretKey.textContent.trim()).then(() => {
            copyLabel.textContent = '¡Copiado!';
            setTimeout(() => {
              copyLabel.textContent = 'Copiar';
            }, 2000);
          });
        });
      }
    });
  </script>
