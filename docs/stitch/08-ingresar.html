<!DOCTYPE html>

<html lang="es-AR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mostry · Ingresá a tu panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&amp;family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mostry: {
              green: '#0E5A4A',
              'green-dark': '#093B31',
              'green-light': '#E6F0ED',
              coral: '#FF7A59',
              'coral-hover': '#F26946',
              bg: '#F7F3EC',
              card: '#FFFFFF',
              border: '#E5DFD3',
              'border-subtle': '#EFECE6',
              text: '#1C1917',
              muted: '#78716C',
              stone: '#A8A29E',
            }
          },
          fontFamily: {
            rubik: ['Rubik', 'sans-serif'],
            sans: ['Work Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Work Sans', sans-serif;
      background-color: #F7F3EC;
      color: #1C1917;
      -webkit-font-smoothing: antialiased;
    }
    .font-rubik {
      font-family: 'Rubik', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="min-h-screen bg-mostry-bg flex flex-col justify-between px-4 py-4 text-mostry-text antialiased selection:bg-mostry-green selection:text-white max-w-[390px] mx-auto">
<!-- Header mínimo / Barra superior de marca -->
<header class="w-full flex items-center justify-between pt-1 pb-4">
<a aria-label="Volver" class="w-10 h-10 rounded-lg border border-mostry-border bg-white flex items-center justify-center text-mostry-green hover:bg-mostry-green-light transition-colors" href="#">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</a>
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full border border-mostry-border bg-white text-[12px] font-medium text-mostry-muted">
<span class="w-2 h-2 rounded-full bg-mostry-green"></span>
<span>Año 2026</span>
</div>
</header>
<!-- Contenedor central a ancho completo móvil -->
<main class="w-full flex flex-col items-center my-auto">
<!-- Logo Mostry oficial del sistema -->
<div class="flex items-center gap-2 mb-6">
<div class="w-9 h-9 rounded-lg bg-mostry-green flex items-center justify-center text-white">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M4 19h4V9H4v10zm6 0h4V5h-4v14zm6 0h4v-7h-4v7z"></path>
</svg>
</div>
<div class="flex flex-col">
<span class="font-rubik text-[22px] font-bold tracking-tight text-mostry-green leading-none">mostry</span>
<span class="text-[10px] uppercase font-bold tracking-wider text-mostry-muted leading-tight mt-0.5">Vidriera de barrio</span>
</div>
</div>
<!-- Contenedor de formulario integrado a mobile -->
<div class="w-full bg-white rounded-2xl border border-mostry-border p-5">
<!-- Título y bajada -->
<div class="mb-5 text-left">
<h1 class="font-rubik text-[22px] font-bold tracking-tight text-mostry-text leading-tight">
          Ingresá a tu panel
        </h1>
<p class="text-[14px] text-mostry-muted mt-1 leading-normal font-normal">
          Gestioná tus pedidos del día, precios, catálogo y libreta de fiados.
        </p>
</div>
<!-- Formulario de acceso -->
<form action="#" class="space-y-4" method="POST" onsubmit="event.preventDefault();">
<!-- Campo Correo Electrónico -->
<div>
<label class="block text-[11px] font-bold uppercase tracking-wider text-mostry-muted mb-1.5" for="email">
            Correo electrónico
          </label>
<div class="relative">
<input class="w-full h-12 px-3.5 rounded-lg border border-mostry-border bg-[#FCFAF7] text-[15px] text-mostry-text placeholder-mostry-stone focus:bg-white focus:outline-none focus:border-mostry-green transition-colors" id="email" name="email" placeholder="nombre@tucorreo.com" required="" type="email" value="rosa@gmail.com"/>
</div>
</div>
<!-- Campo Contraseña -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block text-[11px] font-bold uppercase tracking-wider text-mostry-muted" for="password">
              Contraseña
            </label>
<a class="text-[12px] font-medium text-mostry-green hover:underline" href="#">
              ¿Olvidaste tu contraseña?
            </a>
</div>
<div class="relative flex items-center">
<input class="w-full h-12 pl-3.5 pr-11 rounded-lg border border-mostry-border bg-[#FCFAF7] text-[15px] text-mostry-text placeholder-mostry-stone focus:bg-white focus:outline-none focus:border-mostry-green transition-colors font-mono tracking-wider" id="password" name="password" placeholder="Tu clave secreta" required="" type="password" value="••••••••••••"/>
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-0 top-0 h-12 w-11 flex items-center justify-center text-mostry-muted hover:text-mostry-green transition-colors focus:outline-none" id="togglePassword" onclick="
                const input = document.getElementById('password');
                const icon = document.getElementById('eyeIcon');
                if (input.type === 'password') {
                  input.type = 'text';
                  icon.textContent = 'visibility_off';
                } else {
                  input.type = 'password';
                  icon.textContent = 'visibility';
                }
              " type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Botón Coral Principal de Ingreso -->
<div class="pt-2">
<button class="w-full h-12 rounded-lg bg-mostry-coral hover:bg-mostry-coral-hover active:scale-[0.99] text-white font-rubik text-[16px] font-semibold flex items-center justify-center gap-2 transition-all shadow-none border border-transparent" type="submit">
<span>Ingresar</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Enlace alternativo para crear comercio -->
<div class="mt-5 text-center">
<p class="text-[13px] text-mostry-muted">
        ¿Todavía no tenés vidriera? 
        <a class="font-bold text-mostry-green hover:underline ml-1" href="#">
          Creá tu tienda
        </a>
</p>
</div>
</main>
<!-- Footer sobrio -->
<footer class="w-full pt-6 pb-2 text-center">
<div class="w-8 h-0.5 bg-mostry-border mx-auto mb-2.5"></div>
<p class="text-[11px] text-mostry-muted">
      Mostry · 2026 · Hecho para comercios de barrio
    </p>
</footer>
</body>
</html>
