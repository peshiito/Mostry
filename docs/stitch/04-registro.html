<body class="bg-surface-container-low text-on-surface antialiased min-h-full flex flex-col justify-between selection:bg-primary-fixed selection:text-on-primary-fixed">
<div class="w-full max-w-md mx-auto min-h-full flex flex-col px-space-md py-space-md sm:py-space-lg">
<!-- 1. Cabecera sobria -->
<header class="flex items-center justify-between w-full pb-space-md">
<button aria-label="Volver" class="inline-flex items-center justify-center w-10 h-10 -ml-2 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="font-headline-sm text-headline-sm font-bold tracking-tight text-primary-container lowercase">mostry</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider -mt-1">Vidriera de barrio</span>
</div>
<div class="w-10"></div>
</header>
<!-- 2. Encabezado principal -->
<main class="flex-1 flex flex-col">
<div class="mt-space-sm mb-space-lg text-left">
<h1 class="font-headline-md text-headline-md text-primary-container tracking-tight">Creá tu tienda</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs leading-relaxed">
          Empezá a mostrar tus productos y recibir pedidos directo por WhatsApp.
        </p>
</div>
<!-- 3. Formulario de registro -->
<form class="bg-surface-container-lowest border border-outline-variant rounded-lg p-space-md flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<!-- Campo 1: Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email">Correo electrónico</label>
<div class="relative">
<input class="w-full h-11 px-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="email" name="email" placeholder="nombre@tucorreo.com" type="email"/>
</div>
</div>
<!-- Campo 2: Contraseña -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<div class="relative flex items-center">
<input class="w-full h-11 pl-3 pr-11 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="password" name="password" placeholder="Elegí tu contraseña" type="password" value="ClaveSegura2026"/>
<button aria-label="Mostrar contraseña" class="absolute right-0 top-0 h-11 w-11 flex items-center justify-center text-outline hover:text-on-surface transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="password-icon">visibility</span>
</button>
</div>
<!-- Medidor de seguridad de contraseña -->
<div class="flex flex-col gap-1 mt-1">
<div class="grid grid-cols-4 gap-1.5 w-full">
<span class="h-1 rounded-full bg-primary-container"></span>
<span class="h-1 rounded-full bg-primary-container"></span>
<span class="h-1 rounded-full bg-primary-container"></span>
<span class="h-1 rounded-full bg-surface-container-highest"></span>
</div>
<div class="flex justify-between items-center text-on-surface-variant font-label-sm text-label-sm">
<span>Mínimo 10 caracteres</span>
<span class="text-primary-container font-semibold">Segura</span>
</div>
</div>
</div>
<!-- Campo 3: Nombre del negocio -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="store_name">Nombre del negocio</label>
<input class="w-full h-11 px-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="store_name" name="store_name" placeholder="Ej. Panadería San Cayetano" type="text" value="La Espiga"/>
</div>
<!-- Campo 4: Tu link (subdominio Mostry) -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="store_slug">Tu link en Mostry</label>
<span class="inline-flex items-center gap-1 font-label-sm text-label-sm text-primary-container font-semibold">
<span class="material-symbols-outlined text-[15px]" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
              Disponible
            </span>
</div>
<div class="flex items-stretch rounded-lg border border-outline-variant bg-surface-container-lowest focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container overflow-hidden transition-colors">
<input class="w-full h-11 px-3 bg-transparent border-0 font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0 focus:outline-none" id="store_slug" name="store_slug" placeholder="tu-comercio" type="text" value="laespiga"/>
<span class="inline-flex items-center px-3 bg-surface-container border-l border-outline-variant text-on-surface-variant font-label-md text-label-md select-none">
              .mostry.com.ar
            </span>
</div>
</div>
<!-- Checkbox de términos y condiciones -->
<div class="pt-space-xs flex items-start gap-2.5">
<div class="flex items-center h-5 mt-0.5">
<input checked="" class="w-4 h-4 rounded text-primary-container border-outline-variant focus:ring-primary-container focus:ring-offset-0 cursor-pointer" id="terms" name="terms" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-on-surface leading-snug cursor-pointer" for="terms">
            Acepto los <a class="underline text-on-surface font-semibold hover:text-primary-container" href="#">Términos y condiciones</a> y la <a class="underline text-on-surface font-semibold hover:text-primary-container" href="#">Política de privacidad</a> de Mostry.
          </label>
</div>
<!-- Botón principal de acción -->
<button class="w-full h-12 mt-space-xs rounded-lg bg-secondary-container hover:brightness-105 active:brightness-95 text-on-secondary-container font-label-md text-label-md font-bold tracking-wide uppercase flex items-center justify-center transition-all" type="submit">
          Crear mi tienda
        </button>
</form>
</main>
<!-- 4. Pie del formulario -->
<footer class="mt-space-lg mb-space-sm flex flex-col items-center gap-space-sm text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
        ¿Ya tenés cuenta? 
        <a class="font-semibold text-primary-container hover:underline ml-1" href="#">Ingresá</a>
</p>
<div class="w-12 h-px bg-outline-variant my-space-xs"></div>
<p class="font-label-sm text-label-sm text-outline tracking-wider">
        Mostry · 2026 · Hecho para comercios de barrio
      </p>
</footer>
</div>
<script>
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const passwordIcon = document.getElementById('password-icon');

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      passwordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });

    const storeNameInput = document.getElementById('store_name');
    const storeSlugInput = document.getElementById('store_slug');

    storeNameInput.addEventListener('input', (e) => {
      const sanitized = e.target.value
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
      if (sanitized) {
        storeSlugInput.value = sanitized;
      }
    });
  </script>
